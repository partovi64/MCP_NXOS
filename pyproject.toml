[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-show-tshoot-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "netmiko>=4.4.0", "PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
cisco-show-tshoot-mcp = "cisco_show_tshoot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
