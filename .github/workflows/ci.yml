name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: nxos-mcp
        run: uv sync --extra dev

      - name: Ruff
        working-directory: nxos-mcp
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: nxos-mcp
        run: uv run ruff format --check .

      - name: Mypy (strict)
        working-directory: nxos-mcp
        run: uv run mypy

      - name: Pytest
        working-directory: nxos-mcp
        run: uv run pytest -q

      - name: Smoke test stdio transport
        working-directory: nxos-mcp
        env:
          NXOS_INVENTORY: config/inventory.example.yaml
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | uv run nxos-mcp > /tmp/stdio.jsonl 2>/dev/null
          grep -q '"id":2' /tmp/stdio.jsonl
          grep -q '"tools"' /tmp/stdio.jsonl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nxos-mcp:ci nxos-mcp
