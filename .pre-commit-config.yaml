repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^nxos-mcp/
      - id: ruff-format
        files: ^nxos-mcp/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^nxos-mcp/tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^nxos-mcp/tests/fixtures/
      - id: check-yaml
        files: ^nxos-mcp/
      - id: check-json
        files: ^nxos-mcp/tests/fixtures/
      - id: check-added-large-files
